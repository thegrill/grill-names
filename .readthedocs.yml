version: 2  # required for PY39+
build:
  os: ubuntu-lts-latest
  tools:
    python: "3.14"
  apt_packages:
    - "graphviz"
  jobs:
    post_install:
      - python scripts/build_docs_wheel.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

sphinx:
  configuration: docs/source/conf.py
